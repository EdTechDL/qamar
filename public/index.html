<!DOCTYPE html>
<!--
  Web app shell. Overrides the default Expo template (see
  @expo/cli/static/template/index.html) - the CLI reads public/index.html
  first when web.output is "single". A +html.tsx file does NOT apply in
  "single" output; this is the only hook into the document head.

  CAUTION: the CLI rewrites this file with naive first-occurrence string
  replacement. The lang and title placeholders, and the head and body closing
  tags, are all substitution targets - so none of them may appear anywhere
  above their real position, including inside this comment. Injected at
  export time from app.json: lang, title, theme-color, description, and the
  bundle script tag. Do not declare those here or they will be duplicated.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Qamar" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Parchment before the bundle evaluates, so the first paint isn't white. */
      html,
      body,
      #root {
        background-color: #f5eac7;
      }
      body {
        overscroll-behavior-y: none;
      }
    </style>
  </head>

  <body>
    <noscript>Cette application nécessite JavaScript pour fonctionner.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.warn('Service worker registration failed', error);
          });
        });
      }
    </script>
  </body>
</html>
